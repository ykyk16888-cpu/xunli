/* 版面：日系月曆。米白紙面、墨色細線分區、朱紅只用在「重點」與「印章」 */
:root{
  --bg:#faf8f3; --surface:#faf8f3; --ink:#2b2b2b; --muted:#9a8f80; --line:#d9d2c5;
  --red:#b5452e; --red-soft:#f3e3db; --sea:#5d7686; --chip:#f1ece2;
  --accent:#2b2b2b; --accent-ink:#faf8f3; --leave:#b5452e;
  --scrim:rgba(30,26,20,.38);
  --font-body:"Iansui","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --font-num:var(--font-body);
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1b19; --surface:#1c1b19; --ink:#ece6da; --muted:#8f877b; --line:#3a3732;
  --red:#e07a5f; --red-soft:#3a2721; --sea:#9db4c2; --chip:#26241f;
  --accent:#ece6da; --accent-ink:#1c1b19; --leave:#e07a5f; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1b19; --surface:#1c1b19; --ink:#ece6da; --muted:#8f877b; --line:#3a3732;
  --red:#e07a5f; --red-soft:#3a2721; --sea:#9db4c2; --chip:#26241f;
  --accent:#ece6da; --accent-ink:#1c1b19; --leave:#e07a5f; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
p{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.65;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wrap .wrap{width:100%;min-width:0}
.wrap>*{min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:1.5px solid var(--red);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}

header.top{padding-top:18px;display:flex;align-items:baseline;justify-content:space-between}
header.top h1{margin:0;font-size:27px;font-weight:400;letter-spacing:.35em}
.sub-title{font-size:12.5px;color:var(--muted);letter-spacing:.18em;margin-top:2px}
.hd-month{font-size:13.5px;letter-spacing:.25em;color:var(--muted)}
.section-label{font-size:12px;letter-spacing:.35em;color:var(--muted);display:block;margin-bottom:6px}
.none{color:var(--muted);font-size:13px}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;letter-spacing:.03em}

/* 搜尋：只有底線 */
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:8px 36px 8px 26px;border:none;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:2px;top:50%;width:16px;height:16px;transform:translateY(-50%);stroke:var(--muted);fill:none;stroke-width:1.5;stroke-linecap:round}
.search .clear{position:absolute;right:0;top:50%;transform:translateY(-50%);border:none;background:transparent;width:30px;height:30px;font-size:18px;line-height:1;color:var(--muted)}
input[type=search]::-webkit-search-cancel-button{display:none}
.search input:focus-visible,.manual input:focus-visible,#sv:focus-visible{outline:none;border-bottom:2px solid var(--red)}

/* 種類切換：細框連成一排 */
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink)}
.seg button{border:none;border-right:1px solid var(--ink);background:transparent;padding:6px 0;font-size:14.5px;letter-spacing:.12em;color:var(--ink);border-radius:0}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* 月份：月曆格 */
.months-head{display:flex;justify-content:flex-end;margin-bottom:4px}
.swipe{font-size:11.5px;color:var(--muted);letter-spacing:.12em}
.months{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x proximity;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.months::-webkit-scrollbar{display:none}
.months button{border:none;border-right:1px solid var(--line);background:transparent;flex:none;width:60px;padding:8px 0 9px;border-radius:0;
  display:flex;flex-direction:column;align-items:center;line-height:1.15;scroll-snap-align:center;position:relative}
.months button:last-child{border-right:none}
.months .n{font-size:21px}
.months .u{font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.months button.today{color:var(--red)}
.months button.today::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--red);transform:translateX(-50%)}
.months button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.months button[aria-pressed="true"] .u{color:var(--bg)}

/* 本月重點：沒有卡片，細線分區 */
.highlight{display:grid;gap:0}
.hl-row{padding:10px 0;border-bottom:1px solid var(--line)}
.hl-row h3{margin:0 0 6px;font-size:14px;font-weight:400;letter-spacing:.25em;display:flex;align-items:center;gap:8px}
.pill{font-size:11px;letter-spacing:.05em;padding:0 6px;border:1px solid var(--red);color:var(--red)}
.pill.in,.pill.out{background:transparent}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.summary{font-size:12.5px;color:var(--muted);letter-spacing:.05em}
.summary b{color:var(--ink);font-weight:400}
.switch{display:inline-flex;align-items:center;gap:8px;border:none;background:transparent;padding:4px 0;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.switch .knob{width:30px;height:16px;border:1px solid var(--ink);position:relative}
.switch .knob::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{color:var(--ink)}
.switch[aria-checked="true"] .knob::after{transform:translateX(14px);background:var(--red)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{font-style:normal;width:16px;border-bottom:1px solid var(--ink);height:0;display:inline-block}
.legend i.all{border-color:var(--muted)}
.legend i.farm{border-color:var(--sea)}
.legend i.sel{border-color:var(--red);border-bottom-width:2px}

.cat{display:grid;gap:6px}
.cat h2{margin:0;font-size:12.5px;font-weight:400;letter-spacing:.4em;color:var(--muted);display:flex;align-items:baseline;gap:6px}
.cat h2 .cnt{font-size:11.5px;letter-spacing:.05em}
.tags{display:flex;flex-wrap:wrap;gap:4px 16px}
.tag{border:none;border-bottom:1px solid transparent;background:transparent;border-radius:0;padding:2px 0;font-size:16px;line-height:1.35;color:var(--ink)}
.tag.all{color:var(--muted)}
.tag.farm{color:var(--sea)}
.tag.sel{color:var(--red);border-bottom-color:var(--red)}

/* 標記、產季條、印章 */
.badge{font-size:11.5px;padding:0 6px;border:1px solid var(--muted);color:var(--muted);white-space:nowrap;letter-spacing:.05em}
.badge.now{border-color:var(--ink);color:var(--ink)}
.badge.off{border-color:var(--red);color:var(--red)}
.badge.farm{border-color:var(--sea);color:var(--sea)}
.strip{display:grid;grid-template-columns:repeat(12,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.strip span{font-size:12px;text-align:center;padding:5px 0;border-right:1px solid var(--line);color:var(--muted)}
.strip span:last-child{border-right:none}
.strip span.on{background:var(--red-soft);color:var(--red)}
.strip span.cur{outline:1.5px solid var(--red);outline-offset:-2px}
.range{font-size:13px;letter-spacing:.05em}
.range b{font-weight:400}
.tips{display:grid;gap:7px;font-size:14px;line-height:1.55}
.tips p{display:flex;gap:10px}
.tips b{flex:none;min-width:24px;height:24px;padding:0 3px;border:1.5px solid var(--red);color:var(--red);font-weight:400;font-size:13px;display:grid;place-items:center;margin-top:0}
.tips .warn b{background:var(--red);color:#fff}

.results{display:grid;gap:0}
.row{border-bottom:1px solid var(--line);padding:12px 0;display:grid;gap:8px}
.row-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.row-head .name{font-size:18px;letter-spacing:.15em}
.row-head .meta{font-size:12px;color:var(--muted);letter-spacing:.1em}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:transparent;border-radius:0;padding:4px 12px;font-size:13px;letter-spacing:.1em;color:var(--ink)}
.btn:disabled{opacity:.4}
.btn.add[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn.danger{color:var(--red);border-color:var(--red)}
.empty{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:14px;text-align:center;letter-spacing:.1em}
.empty strong{color:var(--ink);display:block;font-size:15px;font-weight:400}

/* 詳細卡片 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-top:1px solid var(--ink);max-height:85vh;overflow-y:auto;
  padding:16px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.grab{display:none}
.sheet-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sheet-head .name{font-size:24px;letter-spacing:.2em}
.sheet-head .meta{font-size:12px;color:var(--muted);letter-spacing:.1em}
.sheet-head .x{margin-left:auto;border:none;background:transparent;width:34px;height:34px;font-size:22px;line-height:1;color:var(--muted);align-self:center}
.bigbtn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:11px;font-size:15.5px;letter-spacing:.3em;border-radius:0}
.bigbtn.on{background:transparent;color:var(--ink);letter-spacing:.1em}

/* 掃碼 */
.sub-h{font-size:20px;font-weight:400;letter-spacing:.3em;margin:0;padding-top:0}
.scan-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scanbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 8px;border:1px solid var(--ink);background:transparent;font-size:15px;letter-spacing:.2em;cursor:pointer;text-align:center}
.scanbtn.primary{background:var(--ink);color:var(--bg)}
.scanbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.shot{display:flex;gap:10px;align-items:center}
.shot img{width:60px;height:60px;object-fit:cover;border:1px solid var(--line);flex:none}
.status{font-size:13.5px;color:var(--muted)}
.status.err{color:var(--red)}
.manual{display:flex;gap:8px;align-items:flex-end}
.manual input,#sv{flex:1;min-width:0;width:100%;font:inherit;font-size:16px;padding:8px 2px;border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink)}
.result{border:1px solid var(--ink);padding:12px;display:grid;gap:8px;position:relative}
.result .badge{position:absolute;top:-1px;right:-1px;border:none;background:var(--ink);color:var(--bg);padding:2px 8px;letter-spacing:.1em}
.result.warn{border-color:var(--red)}
.result.warn .badge{background:var(--red);color:#fff}
.result .big{font-size:17px;word-break:break-all;line-height:1.4;padding-right:90px}
.result .raw{font-size:12px;word-break:break-all;color:var(--muted)}
.result .msg{font-size:13px;color:var(--red)}
.result .btns{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.linkbtn{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font-size:14.5px;letter-spacing:.15em;padding:2px 0}
.linkbtn.ghost{color:var(--red)}
.checks{display:grid;gap:0}
.check{display:flex;gap:10px;align-items:center;text-align:left;border:none;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;font-size:15px;letter-spacing:.1em;width:100%}
.check .box{width:16px;height:16px;border:1px solid var(--ink);flex:none;display:grid;place-items:center;font-size:11px}
.check[aria-checked="true"] .box{background:var(--ink);color:var(--bg)}
.check[aria-checked="true"] .box::after{content:"✓"}
.pick-list{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px}
.pick-list:empty{display:none}
#svResult:not(:empty){margin-top:4px}

/* 採買清單 */
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.list-head h2{margin:0;font-size:20px;font-weight:400;letter-spacing:.3em}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--red);padding:10px 12px;font-size:13.5px;color:var(--red)}
.group-label{font-size:12px;color:var(--muted);margin:10px 0 0;letter-spacing:.4em}
.items{display:grid;gap:0}
.item{display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.item .chk{width:18px;height:18px;flex:none;margin-top:4px;border:1px solid var(--ink);background:transparent;display:grid;place-items:center;padding:0;font-size:12px;border-radius:0}
.item .chk[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.item .body{flex:1;min-width:0;display:grid;gap:4px}
.item .nm{border:none;background:none;padding:0;text-align:left;font-size:16.5px;letter-spacing:.12em;color:inherit;justify-self:start}
.item .nm .caret{color:var(--muted);margin-left:6px;font-size:10px}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .tips{margin-top:4px;font-size:13.5px}
.item .rm{border:none;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:2px 4px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:7px 16px;font-size:13.5px;letter-spacing:.08em;z-index:50;white-space:nowrap}

/* 底部分頁 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--ink);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
nav.tabs button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;letter-spacing:.15em;color:var(--muted);position:relative}
nav.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs .count{position:absolute;top:7px;left:calc(50% + 7px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;line-height:16px;letter-spacing:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top"><div><h1>旬曆</h1><p class="sub-title">每種食材，都有它的最佳時節</p></div><span class="hd-month" id="hdMonth"></span></header>

  <!-- 這個月 -->
  <section id="view-month" class="wrap" aria-label="這個月">
    <div class="search">
      <label class="vh" for="q">搜尋名稱</label>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="搜尋名稱，例如：花椰菜、蚵仔" autocomplete="off">
      <button class="clear" id="qClear" aria-label="清除搜尋" hidden>×</button>
    </div>
    <div class="seg" id="seg" role="group" aria-label="種類"></div>

    <div id="monthBody" class="wrap">
      <div>
        <div class="months-head"><span class="swipe">← 左右滑動 →</span></div>
        <div class="months" id="months" role="group" aria-label="月份"></div>
      </div>
      <div class="highlight" id="highlight"></div>
      <div class="toolbar">
        <p class="summary" id="summary"></p>
        <button class="switch" id="onlySeasonal" role="switch" aria-checked="false"><span class="knob"></span>只看季節限定</button>
      </div>
      <div class="legend" id="legend">
        <span><i></i>季節限定</span>
        <span class="lg-all"><i class="all"></i>全年都有</span>
        <span class="lg-all"><i class="farm"></i>養殖</span>
        <span><i class="sel"></i>已加入採買</span>
      </div>
      <div id="cats" class="wrap"></div>
    </div>

    <div id="searchBody" class="results" hidden></div>
    <p class="note">蔬菜整理自《菜市場的一年》，水果、海鮮為綜合整理，僅供參考。表上為盛產期，非產季不代表一定是進口。</p>
  </section>

  <!-- 掃碼 -->
  <section id="view-scan" class="wrap" aria-label="掃碼查產地" hidden>
    <h2 class="sub-h">掃碼查產地</h2>
    <div class="scan-actions">
      <input class="vh" type="file" id="shotCam" accept="image/*" capture="environment">
      <label class="scanbtn primary" for="shotCam"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 12h8"/></svg>拍照掃碼</label>
      <input class="vh" type="file" id="shotLib" accept="image/*">
      <label class="scanbtn" for="shotLib"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-8 8.5"/></svg>從相簿選</label>
    </div>
    <div class="shot" id="shotRow" hidden><img id="shotImg" alt="剛拍的照片"><span class="status" id="scanStatus"></span></div>
    <div class="manual">
      <input id="manualIn" type="text" placeholder="或手動輸入追溯號碼／網址" autocomplete="off">
      <button class="btn" id="manualGo">查詢</button>
    </div>
    <div id="scanResult"></div>
    <div>
      <p class="section-label">核對項目</p>
      <div class="checks" id="checks"></div>
    </div>
    <div>
      <label class="section-label" for="sv">產季檢查</label>
      <input id="sv" type="search" placeholder="輸入名稱，例如：高麗菜" autocomplete="off">
      <div class="pick-list" id="svList"></div>
      <div id="svResult"></div>
    </div>
    <div><button class="btn" id="scanReset">重新掃描</button></div>
  </section>

  <!-- 採買清單 -->
  <section id="view-list" class="wrap" aria-label="採買清單" hidden>
    <div class="list-head">
      <h2>採買清單</h2>
      <div class="actions">
        <button class="btn" id="copyBtn">分享</button>
        <button class="btn" id="clearDone">清除已買</button>
        <button class="btn danger" id="clearAll">全部清空</button>
      </div>
    </div>
    <div class="confirm" id="confirmBox" hidden>
      <span>確定要清空整張清單嗎？</span>
      <button class="btn danger" id="confirmYes">清空</button>
      <button class="btn" id="confirmNo">取消</button>
    </div>
    <div id="listBody"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName" hidden></div>

<nav class="tabs" aria-label="分頁">
  <div class="in" role="tablist">
    <button role="tab" data-tab="month" aria-selected="true">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>這個月</button>
    <button role="tab" data-tab="scan" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>掃碼</button>
    <button role="tab" data-tab="list" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M5 7h14l-1.4 10.2a2 2 0 0 1-2 1.8H8.4a2 2 0 0 1-2-1.8L5 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>採買清單<span class="count" id="navCount" hidden></span></button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

const CAT_NAME = {根莖:"根莖類",瓜果:"瓜果類",菇:"菇類",葉菜:"葉菜類",豆:"豆類",辛香:"辛香類",水果:"水果類",海鮮:"海鮮類"};
const GROUP_OF = c => c==="水果"?"水果":c==="海鮮"?"海鮮":"蔬菜";
const SEGS = ["全部","蔬菜","水果","海鮮"];
const VEG = DATA.items.map(([name,cat,months,farm,aliases])=>({name,cat,months:new Set(months),
  all:months.length===12,farm:!!farm,aliases,group:GROUP_OF(cat)}));
const BY_NAME = Object.fromEntries(VEG.map(v=>[v.name,v]));
const TODAY_M = new Date().getMonth()+1;
const KEY = "dangji-caili-v1";

let state = {list:[], onlySeasonal:false, seg:"全部"};
try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&Array.isArray(s.list)) state = {...state,...s}; }catch(e){}
state.list = state.list.filter(it=>BY_NAME[it.v]);
if(!SEGS.includes(state.seg)) state.seg="全部";
let month = TODAY_M;
const openTips = new Set();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inList = n=>state.list.some(it=>it.v===n);
const prevM = m=>m===1?12:m-1, nextM = m=>m===12?1:m+1;
const inSeg = v=>state.seg==="全部"||v.group===state.seg;
const catsInSeg = ()=>DATA.cats.filter(c=>state.seg==="全部"||GROUP_OF(c)===state.seg);

function rangeText(v){
  if(v.all) return "全年";
  const on = i=>v.months.has(((i-1+12)%12)+1);
  const runs=[];
  for(let m=1;m<=12;m++){ if(on(m)&&!on(m-1)){ let e=m; while(on(e+1)&&e-m<11) e++; runs.push([m,((e-1)%12)+1]); } }
  return runs.map(([a,b])=>a===b?`${a}月`:`${a}–${b}月`).join("、");
}
function badgeHTML(v,withNext){
  if(v.farm) return `<span class="badge farm">養殖・全年</span>`;
  if(v.all) return `<span class="badge">全年都有</span>`;
  if(!v.months.has(TODAY_M)) return `<span class="badge off">${withNext?"非產季":"本月非產季"}</span>`;
  if(withNext&&!v.months.has(nextM(TODAY_M))) return `<span class="badge off">下月下市</span>`;
  return `<span class="badge now">${withNext?"當季":"本月當季"}</span>`;
}
function tagHTML(v){
  const cls=v.farm?" farm":v.all?" all":"";
  return `<button class="tag${cls}${inList(v.name)?" sel":""}" data-open="${esc(v.name)}">${esc(v.name)}</button>`;
}
function stripHTML(v){
  let h='<div class="strip" aria-hidden="true">';
  for(let m=1;m<=12;m++) h+=`<span class="${v.months.has(m)?"on":""}${m===TODAY_M?" cur":""}">${m}</span>`;
  return h+'</div>';
}
function tipsHTML(v){
  const t=DATA.tips[v.name]; if(!t) return "";
  const w=v.group==="海鮮"?"處理":"洗";
  return `<div class="tips"><p><b>挑</b><span>${esc(t[0])}</span></p><p><b>${w}</b><span>${esc(t[1])}</span></p><p><b>存</b><span>${esc(t[2])}</span></p>${t[3]?`<p class="warn"><b>禁</b><span>${esc(t[3])}</span></p>`:""}</div>`;
}
function matchVeg(q){ return VEG.filter(v=>v.name.includes(q)||v.aliases.some(a=>a.includes(q)||(q.length>=2&&q.includes(a)))); }

/* ---------- 這個月 ---------- */
function renderSeg(){ $("#seg").innerHTML=SEGS.map(s=>`<button data-seg="${s}" aria-pressed="${s===state.seg}">${s}</button>`).join(""); }
function renderMonths(){
  let h="";
  for(let m=1;m<=12;m++) h+=`<button data-m="${m}" class="${m===TODAY_M?"today":""}" aria-pressed="${m===month}" aria-label="${m}月${m===TODAY_M?"（本月）":""}"><span class="n">${m}</span><span class="u">月</span></button>`;
  $("#months").innerHTML=h;
  $("#hdMonth").textContent=["一","二","三","四","五","六","七","八","九","十","十一","十二"][month-1]+"月";
  const box=$("#months"), el=box.querySelector('[aria-pressed="true"]');
  if(el&&box.clientWidth){ const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    box.scrollTo({left:el.offsetLeft-(box.clientWidth-el.offsetWidth)/2,behavior:renderMonths.done&&!reduce?"smooth":"auto"}); renderMonths.done=true; }
}
function renderHighlight(){
  const now=VEG.filter(v=>inSeg(v)&&v.months.has(month));
  const enter=now.filter(v=>!v.months.has(prevM(month)));
  const leave=now.filter(v=>!v.months.has(nextM(month)));
  const row=(title,cls,arr)=>`<div class="hl-row"><h3>${title}<span class="pill ${cls}">${arr.length} 種</span></h3>
    ${arr.length?`<div class="tags">${arr.map(tagHTML).join("")}</div>`:`<span class="none">這個月沒有</span>`}</div>`;
  $("#highlight").innerHTML=row("新進場","in",enter)+row("快下市","out",leave);
  const seasonal=now.filter(v=>!v.all).length;
  $("#summary").innerHTML=`${month}月當季 <b>${now.length}</b> 種・季節限定 <b>${seasonal}</b> 種`;
}
function renderCats(){
  $("#onlySeasonal").setAttribute("aria-checked",state.onlySeasonal);
  document.querySelectorAll(".lg-all").forEach(e=>e.hidden=state.onlySeasonal);
  let h="";
  for(const c of catsInSeg()){
    let arr=VEG.filter(v=>v.cat===c&&v.months.has(month));
    if(state.onlySeasonal) arr=arr.filter(v=>!v.all);
    arr.sort((a,b)=>a.all-b.all);
    h+=`<div class="cat"><h2>${CAT_NAME[c]}<span class="cnt">${arr.length} 種</span></h2>`+
      (arr.length?`<div class="tags">${arr.map(tagHTML).join("")}</div>`:`<span class="none">這個月沒有季節限定的${CAT_NAME[c]}</span>`)+`</div>`;
  }
  $("#cats").innerHTML=h;
}
function renderSearch(){
  const q=$("#q").value.trim();
  $("#qClear").hidden=!q; $("#monthBody").hidden=!!q; $("#searchBody").hidden=!q;
  if(!q){ $("#searchBody").innerHTML=""; return; }
  const arr=matchVeg(q).filter(inSeg);
  if(!arr.length){ $("#searchBody").innerHTML=`<div class="empty"><strong>表上沒有「${esc(q)}」</strong></div>`; return; }
  $("#searchBody").innerHTML=arr.map(v=>`<div class="row"><div class="row-head"><span class="name">${esc(v.name)}</span>${badgeHTML(v)}<span class="meta">${CAT_NAME[v.cat]}</span></div>
    ${stripHTML(v)}<div class="range">產季：<b>${rangeText(v)}</b></div>
    <div class="row-btns"><button class="btn" data-open="${esc(v.name)}">挑・${v.group==="海鮮"?"處理":"洗"}・存</button>
    <button class="btn add" data-v="${esc(v.name)}" aria-pressed="${inList(v.name)}">${inList(v.name)?"✓ 已加入":"＋ 採買"}</button></div></div>`).join("");
}

/* ---------- 詳細卡片 ---------- */
let sheetName=null, lastFocus=null;
function renderSheet(){
  const v=sheetName&&BY_NAME[sheetName]; if(!v) return;
  const added=inList(v.name);
  $("#sheet").innerHTML=`<div class="sheet-in"><div class="grab"></div>
    <div class="sheet-head"><span class="name" id="sheetName">${esc(v.name)}</span>${badgeHTML(v)}<span class="meta">${CAT_NAME[v.cat]}</span>
      <button class="x" id="sheetClose" aria-label="關閉">×</button></div>
    ${stripHTML(v)}<div class="range">產季：<b>${rangeText(v)}</b></div>
    ${tipsHTML(v)}
    <button class="bigbtn${added?" on":""}" data-v="${esc(v.name)}">${added?"✓ 已在採買清單（點一下移除）":"＋ 加入採買"}</button></div>`;
}
function openSheet(name){
  sheetName=name; lastFocus=document.activeElement; renderSheet();
  $("#scrim").hidden=false; $("#sheet").hidden=false; document.body.classList.add("lock");
  const c=$("#sheetClose"); if(c) c.focus({preventScroll:true});
}
function closeSheet(){
  sheetName=null; $("#scrim").hidden=true; $("#sheet").hidden=true; document.body.classList.remove("lock");
  if(lastFocus&&lastFocus.focus) try{ lastFocus.focus({preventScroll:true}); }catch(e){}
}

/* ---------- 採買清單 ---------- */
let confirmOpen=false;
function renderList(){
  const n=state.list.filter(it=>!it.done).length;
  const nc=$("#navCount"); nc.hidden=!n; nc.textContent=n;
  $("#confirmBox").hidden=!confirmOpen;
  const has=state.list.length;
  ["#copyBtn","#clearDone","#clearAll"].forEach(s=>$(s).disabled=!has);
  if(!has){ $("#listBody").innerHTML=`<div class="empty"><strong>清單是空的</strong>點名稱即可加入。</div>`; return; }
  let h="";
  for(const c of DATA.cats){
    const items=state.list.filter(it=>BY_NAME[it.v].cat===c);
    if(!items.length) continue;
    h+=`<p class="group-label">${CAT_NAME[c]}</p><div class="items">`+items.map(it=>{
      const v=BY_NAME[it.v], o=openTips.has(v.name);
      return `<div class="item${it.done?" done":""}"><button class="chk" role="checkbox" data-done="${esc(v.name)}" aria-checked="${!!it.done}" aria-label="已買${esc(v.name)}">${it.done?"✓":""}</button>
        <div class="body"><button class="nm" data-tip="${esc(v.name)}" aria-expanded="${o}">${esc(v.name)}<span class="caret">${o?"▲":"▼"}</span></button>
        <span class="sub">${badgeHTML(v,true)}產季 ${rangeText(v)}</span>${o?tipsHTML(v):""}</div>
        <button class="rm" data-rm="${esc(v.name)}" aria-label="移除${esc(v.name)}">×</button></div>`;
    }).join("")+`</div>`;
  }
  $("#listBody").innerHTML=h;
}

function renderAll(){ renderSeg(); renderMonths(); renderHighlight(); renderCats(); renderSearch(); renderList(); renderPicked(); }
function toggle(name){
  const i=state.list.findIndex(it=>it.v===name);
  if(i>=0){ state.list.splice(i,1); toast(`已移除：${name}`); } else { state.list.push({v:name,done:false}); toast(`已加入採買：${name}`); }
  save(); renderHighlight(); renderCats(); renderSearch(); renderList(); renderPicked(); renderSheet();
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,1600); }
function setTab(tab){
  ["month","scan","list"].forEach(t=>{ $("#view-"+t).hidden=t!==tab; document.querySelector(`[data-tab="${t}"]`).setAttribute("aria-selected",t===tab); });
  window.scrollTo(0,0);
  if(tab==="month") renderMonths();
}
function copyText(t,msg){ try{ navigator.clipboard.writeText(t).then(()=>toast(msg),()=>fallbackCopy(t)); }catch(e){ fallbackCopy(t); } }
function fallbackCopy(text){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  ta.remove(); toast(ok?"已複製":"無法複製，請手動選取");
}

document.addEventListener("click",e=>{
  if(e.target.id==="scrim") return closeSheet();
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tab) return setTab(b.dataset.tab);
  if(b.id==="sheetClose") return closeSheet();
  if(b.dataset.open) return openSheet(b.dataset.open);
  if(b.dataset.seg){ state.seg=b.dataset.seg; save(); renderSeg(); renderHighlight(); renderCats(); renderSearch(); return; }
  if(b.dataset.tip){ const n=b.dataset.tip; openTips.has(n)?openTips.delete(n):openTips.add(n); renderList(); return; }
  if(b.dataset.pick){ picked=b.dataset.pick; $("#sv").value=picked; $("#svList").innerHTML=""; renderPicked(); return; }
  if(b.dataset.chk!==undefined){ b.setAttribute("aria-checked", b.getAttribute("aria-checked")!=="true"); return; }
  if(b.dataset.m){ month=+b.dataset.m; renderMonths(); renderHighlight(); renderCats(); return; }
  if(b.dataset.v) return toggle(b.dataset.v);
  if(b.dataset.done){ const it=state.list.find(x=>x.v===b.dataset.done); it.done=!it.done; save(); renderList(); return; }
  if(b.dataset.rm) return toggle(b.dataset.rm);
  if(b.id==="qClear"){ $("#q").value=""; renderSearch(); $("#q").focus(); return; }
  if(b.id==="onlySeasonal"){ state.onlySeasonal=!state.onlySeasonal; save(); renderCats(); return; }
  if(b.id==="clearDone"){ const k=state.list.filter(x=>x.done).length; state.list=state.list.filter(x=>!x.done); save(); renderAll(); toast(k?`已清除 ${k} 項`:"沒有已買的項目"); return; }
  if(b.id==="clearAll"){ confirmOpen=true; renderList(); return; }
  if(b.id==="confirmNo"){ confirmOpen=false; renderList(); return; }
  if(b.id==="confirmYes"){ confirmOpen=false; state.list=[]; save(); renderAll(); toast("清單已清空"); return; }
  if(b.id==="copyBtn"){
    const todo=state.list.filter(x=>!x.done), lines=[`採買清單（${TODAY_M}月）`];
    for(const c of DATA.cats){ const n=todo.filter(x=>BY_NAME[x.v].cat===c).map(x=>x.v); if(n.length) lines.push(`${CAT_NAME[c]}：${n.join("、")}`); }
    const text=lines.length>1?lines.join("\n"):"採買清單：都買齊了";
    if(navigator.share){ navigator.share({title:"採買清單",text}).catch(err=>{ if(err&&err.name!=="AbortError") copyText(text,"已複製"); }); }
    else copyText(text,"已複製");
    return;
  }
  if(b.id==="copyCode"){ copyText(b.dataset.code,"號碼已複製"); return; }
  if(b.id==="manualGo"){ const t=$("#manualIn").value.trim(); if(t){ $("#shotRow").hidden=true; showResult(t); } else toast("請先輸入號碼或網址"); return; }
  if(b.id==="scanReset"){ resetScan(); return; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheetName) closeSheet(); });
$("#q").addEventListener("input",renderSearch);

/* ---------- 掃碼 ---------- */
const CHECKS=["品名","產地／生產者","包裝或採收日期","驗證機構","有效期限"];
let picked=null;
function renderChecks(){ $("#checks").innerHTML=CHECKS.map((a,i)=>`<button class="check" role="checkbox" aria-checked="false" data-chk="${i}"><span class="box"></span><span>${a}</span></button>`).join(""); }
function classify(raw){
  const t=raw.trim(); let u=null;
  try{ if(/^https?:\/\//i.test(t)) u=new URL(t); }catch(e){}
  if(!u && /^([a-z0-9-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(t)){ try{ u=new URL("https://"+t); }catch(e){} }
  if(u) return {type:/(^|\.)gov\.tw$/i.test(u.hostname)?"gov":"other",url:u.href,host:u.hostname};
  const c=t.replace(/[\s-]/g,"");
  if(/^[0-9A-Za-z]{6,40}$/.test(c) && /\d{6,}/.test(c)) return {type:"code",code:c};
  return {type:"text",text:t};
}
function showResult(raw){
  const r=classify(raw); let h="";
  if(r.type==="gov") h=`<div class="result gov"><span class="badge now" style="justify-self:start">政府追溯網站</span>
    <div class="big">${esc(r.host)}</div><div class="raw">${esc(r.url)}</div>
    <div class="btns"><a class="linkbtn" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">開啟官方查詢 ↗</a></div></div>`;
  else if(r.type==="other") h=`<div class="result warn"><span class="badge off" style="justify-self:start">注意</span>
    <div class="big">這不是政府網站</div><div class="raw">${esc(r.url)}</div>
    <p class="msg">政府追溯網址以 gov.tw 結尾。</p>
    <div class="btns"><a class="linkbtn ghost" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">仍要開啟</a></div></div>`;
  else if(r.type==="code") h=`<div class="result"><span class="badge" style="justify-self:start">追溯號碼</span>
    <div class="big" style="font-family:var(--font-num)">${esc(r.code)}</div>
    <div class="btns"><button class="btn" id="copyCode" data-code="${esc(r.code)}">複製號碼</button>
    <a class="linkbtn" href="https://taft.moa.gov.tw/" target="_blank" rel="noopener noreferrer">到產銷履歷網站 ↗</a></div></div>`;
  else h=`<div class="result warn"><span class="badge off" style="justify-self:start">看不出用途</span><div class="raw">${esc(r.text)}</div></div>`;
  $("#scanResult").innerHTML=h; renderChecks();
}
function setStatus(msg,err){ const s=$("#scanStatus"); s.textContent=msg; s.classList.toggle("err",!!err); }
function loadImg(url){ return new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=no; im.src=url; }); }
function tryJsQR(img,max){
  const W=img.naturalWidth,H=img.naturalHeight, k=Math.min(1,max/Math.max(W,H));
  const w=Math.max(1,Math.round(W*k)), h=Math.max(1,Math.round(H*k));
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const cx=cv.getContext("2d",{willReadFrequently:true}); cx.drawImage(img,0,0,w,h);
  const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"attemptBoth"});
  return r&&r.data?r.data:null;
}
async function decode(file,url){
  if("BarcodeDetector" in window){
    try{ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes("qr_code")){
      const r=await new BarcodeDetector({formats:["qr_code"]}).detect(await createImageBitmap(file)); if(r.length) return r[0].rawValue; } }catch(e){}
  }
  if(typeof jsQR!=="function") throw new Error("nolib");
  const img=await loadImg(url);
  for(const m of [1200,800,1800]){ const d=tryJsQR(img,m); if(d) return d; }
  return null;
}
let lastUrl=null;
async function onShot(e){
  const file=e.target.files&&e.target.files[0]; e.target.value=""; if(!file) return;
  if(lastUrl) URL.revokeObjectURL(lastUrl); lastUrl=URL.createObjectURL(file);
  $("#shotImg").src=lastUrl; $("#shotRow").hidden=false; $("#scanResult").innerHTML=""; setStatus("辨識中…");
  try{
    const d=await decode(file,lastUrl);
    if(d){ setStatus("已辨識"); showResult(d); } else setStatus("找不到 QR Code，請靠近一點再拍。",true);
  }catch(err){ setStatus(err&&err.message==="nolib"?"辨識元件未載入。":"無法讀取這張照片。",true); }
}
function renderPicked(){
  const box=$("#svResult"); const v=picked&&BY_NAME[picked]; if(!v){ box.innerHTML=""; return; }
  const tip=v.all||v.months.has(TODAY_M)?"":"非盛產期，多留意產地標示。";
  box.innerHTML=`<div class="row"><div class="row-head"><span class="name">${esc(v.name)}</span>${badgeHTML(v)}<span class="meta">${CAT_NAME[v.cat]}</span></div>
    ${stripHTML(v)}<div class="range">產季：<b>${rangeText(v)}</b></div>${tip?`<p style="font-size:13.5px;color:var(--leave)">${tip}</p>`:""}${tipsHTML(v)}
    <div class="row-btns"><button class="btn add" data-v="${esc(v.name)}" aria-pressed="${inList(v.name)}">${inList(v.name)?"✓ 已加入":"＋ 採買"}</button></div></div>`;
}
function resetScan(){
  $("#scanResult").innerHTML=""; $("#shotRow").hidden=true; $("#manualIn").value=""; $("#sv").value="";
  $("#svList").innerHTML=""; picked=null; renderPicked(); renderChecks();
  if(lastUrl){ URL.revokeObjectURL(lastUrl); lastUrl=null; }
}
$("#shotCam").addEventListener("change",onShot);
$("#shotLib").addEventListener("change",onShot);
$("#manualIn").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#manualGo").click(); } });
$("#sv").addEventListener("input",()=>{
  const q=$("#sv").value.trim(); picked=null; renderPicked();
  $("#svList").innerHTML=q?(matchVeg(q).slice(0,12).map(v=>`<button class="tag" data-pick="${esc(v.name)}">${esc(v.name)}</button>`).join("")||`<span class="none">表上沒有「${esc(q)}」</span>`):"";
});

renderChecks();
renderAll();
const h=location.hash.slice(1); if(["month","scan","list"].includes(h)) setTab(h);
</script>

<script>
if("serviceWorker" in navigator){ addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
</body>
